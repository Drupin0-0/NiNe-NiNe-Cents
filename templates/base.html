<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninety-Nine-Cents</title>
    
    <style>
        :root {
            --bg-color: #111111;
            --card-bg: #1a1a1a;
            --card-border: #2a2a2a;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent: #a855f7;
            --accent-dark: #7c3aed;
            --accent-light: #c084fc;
            --post-color: oklch(47.05% 0.22782 308.354);
            --get-color: #3b82f6;
            --get-bg: rgba(59, 130, 246, 0.1);
            --post-bg: rgba(168, 85, 247, 0.1);
            --header-bg: #1a0a2e;
            --header-border: #3b1f6e;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .api-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 24px;
        }

        .api-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--header-bg);
            border: 1px solid var(--header-border);
            border-left: 4px solid var(--accent);
            padding: 28px 36px;
            margin-bottom: 32px;
            border-radius: 12px;
        }

        .api-header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: baseline;
            gap: 12px;
            letter-spacing: -0.5px;
        }

        .title-main {
            background: linear-gradient(to right, #c084fc, #e879f9);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-price {
            background: linear-gradient(to right, #10b981, #34d399);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2rem;
            font-weight: 700;
        }

        .badge-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid #10b981;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        .api-card {
            background-color: var(--card-bg);
            padding: 28px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--accent);
            transition: border-color 0.2s;
        }

        .api-card:hover {
            border-color: var(--accent);
            border-left-color: var(--accent-light);
        }

        .api-card h2 {
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--accent-light);
            letter-spacing: -0.3px;
        }

        .api-card p {
            color: var(--text-muted);
            line-height: 1.7;
            margin: 0 0 16px;
        }

        .group-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .group-list li {
            padding: 12px 0;
            color: var(--text-muted);
            border-bottom: 1px solid var(--card-border);
            font-size: 1rem;
        }

        .group-list li:last-child {
            border-bottom: none;
        }

        .endpoint-block {
            background-color: #0d0d0d;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            margin-bottom: 16px;
        }

        .endpoint-block:last-child {
            margin-bottom: 0;
        }

        .endpoint-header {
            display: flex;
            align-items: center;
            background-color: #161616;
            padding: 12px 16px;
            gap: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .method-post {
            background-color: var(--accent);
            color: #fff;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .method-get {
            background-color: var(--get-color);
            color: #fff;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .endpoint-url {
            color: var(--text-main);
            font-weight: 600;
            font-family: monospace;
            font-size: 0.95rem;
            background: none;
            border: none;
            padding: 0;
        }

        .endpoint-details {
            padding: 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .endpoint-details p {
            margin: 0 0 12px;
        }

        .endpoint-details p:last-child {
            margin-bottom: 0;
        }

        .endpoint-details strong {
            color: var(--text-main);
        }

        code {
            background-color: #0d0d0d;
            padding: 3px 8px;
            border-radius: 4px;
            color: var(--accent-light);
            font-family: monospace;
            font-size: 0.88rem;
            border: 1px solid var(--card-border);
        }

        pre {
            background-color: #0d0d0d;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            margin: 0;
        }

        pre code {
            background: none;
            border: none;
            padding: 0;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    {% block content %}
    {% endblock %}
</body>
</html>
