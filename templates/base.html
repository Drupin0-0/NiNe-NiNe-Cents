<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nine-nine-cents</title>
    
    <!-- Estilização CSS Moderna -->
    <style>
        /* Paleta de Cores Base e Reset */
        :root {
            --bg-color: #0f172a;       /* Azul escuro profundo */
            --card-bg: #1e293b;        /* Azul ardósia para os blocos */
            --text-main: #f8fafc;      /* Branco suave */
            --text-muted: #94a3b8;     /* Cinza azulado para textos secundários */
            --accent: #6366f1;         /* Roxo/Índigo moderno */
            --post-color: #10b981;     /* Verde esmeralda para o método POST */
            --post-bg: rgba(16, 185, 129, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* Container Centralizado */
        .api-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        /* Cabeçalho */
        .api-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--card-bg);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .api-header h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(to right, #4f46e5, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge-status {
            background-color: var(--post-bg);
            color: var(--post-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid var(--post-color);
        }

        /* Cards de Conteúdo */
        .api-card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .api-card h2 {
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--accent);
        }

        .api-card p {
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Lista do Grupo */
        .group-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .group-list li {
            padding: 10px 0;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .group-list li:last-child {
            border-bottom: none;
        }

        /* Bloco do Endpoint */
        .endpoint-block {
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .endpoint-header {
            display: flex;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 12px 16px;
            gap: 16px;
        }

        .method-post {
            background-color: var(--post-color);
            color: #fff;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .endpoint-url {
            color: var(--text-main);
            font-weight: 600;
        }

        .endpoint-details {
            padding: 16px;
        }

        code {
            background-color: #0f172a;
            padding: 4px 8px;
            border-radius: 4px;
            color: #e2e8f0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    {% block content %}
    {% endblock %}
</body>
</html>
